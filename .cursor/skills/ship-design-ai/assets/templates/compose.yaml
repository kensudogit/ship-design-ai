services:
  api:
    build: ./api
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg://ship:${POSTGRES_PASSWORD}@db:5432/ship_design
    depends_on: [db]
  web:
    build: ./web
    ports: ['3000:3000']
    depends_on: [api]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ship_design
      POSTGRES_USER: ship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
